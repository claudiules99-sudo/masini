<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Banii mei">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Banii mei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="brand" onclick="openSettings()" aria-label="Setări"><span class="mark">H</span><span class="dot" id="syncDot"></span></button>
    <div class="mswitch">
      <button class="icon" id="mPrev" aria-label="Luna anterioară"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="mLbl" id="mLbl"></span>
      <button class="icon" id="mNext" aria-label="Luna următoare"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-v="acasa"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6 9.5V19h12V9.5"/></svg><span>Acasă</span></button>
    <button data-v="ore"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><path d="M16 5.5a3 3 0 010 5.5M17.5 14c1.6.6 2.7 2.2 3 5"/></svg><span>Ore</span></button>
    <button data-v="chelt"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M16 15h2"/></svg><span>Cheltuieli</span></button>
    <button data-v="bebe"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="6"/><path d="M9.5 11.5c.7.8 1.5 1.1 2.5 1.1s1.8-.3 2.5-1.1M12 4c-1 0-1.5.6-1.5 1.2S11 6.2 12 6"/><path d="M8 20c1-1.5 2.4-2.2 4-2.2s3 .7 4 2.2"/></svg><span>Bebe</span></button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div id="toast" role="status"></div>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
